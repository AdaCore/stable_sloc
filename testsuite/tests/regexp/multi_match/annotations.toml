# This exempts all ada defensive code in the form
#
# if <expression> then
#    raise <Name>_Error;
# end if;
[ada_defensive_code]
kind="regexp"
annotations=[{justification="defensive code, never to be executed"}]
file="*.adb"
matcher.regexp='if [^;]* then( |\n)*raise [a-z]*_error;( |\n)*end if;'
matcher.case_insensitive=true
