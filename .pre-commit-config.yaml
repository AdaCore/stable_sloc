repos:
  - repo: local
    hooks:
      - id: gnatformat
        name: Run gnatformat
        entry: gnatformat
        language: system
        files: "^(src|cli)/.*.ad(b|s)"
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
    - id: flake8
      additional_dependencies:
        - flake8-bugbear
        - flake8-builtins
        - flake8-comprehensions
        - pygments
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
    - id: black
      args: ["--line-length=79"]
